  resolving_measurement: >
    Run the existing shop_regime.py / regime/matrix.py stratification to completion against
    the standard tape panel and check whether candidate margin/own-money ranking flips
    between regimes, per the market_interaction contract (20 seeds x 3 independent sets,
    both own and margin, t>=2.0).
  would_do: >
    A reproducible ranking flip or interaction is found across regimes on >=2 of 3 seed
    sets, clearing the full market_interaction contract depth -- only then would a
    regime-conditional policy branch become a candidate architecture direction. Given the
    recent nulls (adaptive_melon_timing, land_deadline_horizon, hire_gate_output_loss all
    ABANDONed on thinner evidence claims), the burden of proof here should be high before
