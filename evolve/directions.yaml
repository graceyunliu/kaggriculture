  date: 2026-09-11
  type: nonlinear_threshold
  mechanism: 'Non-ongoing crops (WHEAT, CARROT, MELON) may expire via max_lifespan_step decay (_decay_plants)
    before being harvested, an irreversible hard cutoff. tools/crop_window_trace.py (panel: 4 tapes x
    2 independent 20-seed sets, ~20,721 plantings) found O26''s WHEAT decay rate stable at 4.4-7.6% on
    every tape/set cell vs 0.0-1.2% for every tape opponent on the same games -- the one crop/policy gap
    in the panel that cleared "positive on every tape, stable across sets". tools/wheat_decay_bridge.py
    then read the candidate''s own per-turn actions on every decayed wheat tile directly (a unit occupies
    one tile per turn and can only take one action, so this is not inferred, it is observed): across all
    4 tapes x 2 sets (802 decayed tiles total), 95-99% of decayed tiles are VISITED_WATERED_BELOW_MAX
    (a unit was standing on the tile and chose WATER over HARVEST on a turn when yield_units was already
    >0 but still below WHEAT''s max_yield); NEVER_VISITED (the free-fix, zero-displacement class) is 0%
    in every single panel cell.

    '
  superseded_framing: 'ORIGINAL (pre-bridge) framing was "find missed harvests and recover them" -- a
    scheduling/ dispatch-failure hypothesis. The bridge falsifies that framing cleanly: there is essentially
    no zero-cost recovery class (0% NEVER_VISITED, panel-wide). O26 is not failing to reach or forgetting
    these tiles; it is making a deliberate, repeated growth-vs-harvest tradeoff (keep watering for more
    yield instead of banking a smaller guaranteed amount) and losing that bet on ~5-7% of plantings. That
    closes the "recoverable dispatch failure" hypothesis; do not reopen it without a new instrument. The
    mechanism itself, the decay-rate asymmetry vs every tape, and the panel depth stand as confirmed groundwork
    for the reframed question below.

    '
  unknown: 'Whether O26''s current implicit wheat stopping rule (keep growing until forced) is economically
    too aggressive -- i.e. whether harvesting wheat earlier, near the max_lifespan_step boundary, has
    a stable INTERIOR economic optimum (harvest-yield-threshold x remaining-lifespan-threshold) that beats
    both "always keep growing" (current, ~5-7% decay loss) and "always harvest early" (guaranteed-but-smaller
    yield on every tile, sacrificing the ~93-96% that would have matured fine). This is now a pure threshold/dose-response
    question, not a scheduling-fix question.

    '
  resolving_measurement: 'A fixed-cutoff sweep (analogous to melon_cutoff_sweep-sep11''s method, which
    is the durable precedent for this exact "protected window tolerates edge trimming, not interior interruption"
    class): sweep a small number of harvest-yield / remaining-lifespan-to-max_lifespan_step threshold
    combinations for WHEAT (e.g. harvest immediately once yield_units >= N with fewer than K turns of
    margin before max_lifespan_step, for a handful of (N, K) pairs bracketing the engine''s own max_yield=6
    and the ~8-step decay window), segmented/panel-tested per the nonlinear_threshold contract (20 seeds
    x 2 sets, own + margin, dose-response with interior optimum required -- a monotone result is an artefact
    per melon_cutoff_sweep''s lesson).

    '
  would_do: 'A stable interior (N, K) configuration improves BOTH own money and margin at contract depth
    (20 x 2, t>=2.0), replicated across tapes, with a genuine interior optimum (not a monotone edge value,
    which would indicate the sweep is measuring something else).

    '
  would_abandon: 'Monotonic deterioration in either direction (no interior optimum -- "always grow" or
    "always harvest early" wins outright), OR an interior optimum exists but its gain does not clear the
    $250/metric noise floor once the sacrificed yield on the majority of tiles that would have matured
    fine is netted out, OR the result fails to replicate across seed sets/tapes (the demand_share_up and
    M=89 pattern: a win that doesn''t survive held-out is not a win).

    '
  cost: 'Cheap-to-moderate sweep (single-crop, single-knob-pair, existing sweep methodology to copy from
    melon_cutoff_sweep) but explicitly LOWER PRIORITY than a free-recovery mechanism would have been --
    every candidate intervention here necessarily displaces productive watering on tiles that would otherwise
    have reached higher yield, unlike a true dispatch fix which has no such cost. Sequenced behind the
    newly-unblocked animal marginal-economics experiments (the animal_scaling structural-dead-knob findings)
    -- this thread is an optimization of a deliberate, already- reasonable-looking tradeoff, not a bug
    fix, and the O29/O30/O31/O32 family''s track record on "protect an irreversible loss" interventions
    argues for caution and lower urgency, not for stopping the thread. The value of this work so far is
    avoiding a wrong candidate (a wheat "protection" guardrail built on the false recoverability premise),
    not finding a candidate.

    '
