- id: min_hands_knob_interactions
  state: DELAY
  type: knob
  mechanism: "min_hands_lower (DO, min_hands 3->2) and three of the other individually-mild-positive knobs from knob_space_local_optimum_sweep (hands_early=4 +681 h2h, max_animals=21 +701 h2h, feed_spare_poor=3 +406 h2h) were each tested ALONE, one-at-a-time. A dev h2h check of the pairwise and 4-way combinations found real, code-confirmed interaction: `floor = KNOBS['hands_early'] if (KNOBS['hands_early'] and day<=10) else KNOBS['min_hands']` means hands_early, when nonzero, REPLACES min_hands as the early-window floor rather than adding to it -- combo(min_hands=2, hands_early=4) scored +681 h2h, identical to hands_early=4 alone, not the ~2,200 an additive read of the two singles would suggest. Every tested combination is sub-additive versus the naive sum of its singles, and the 4-way combo (+1,151 h2h) actually underperforms the best 2-way combo (min_hands=2 + feed_spare_poor=3, +1,593 h2h, the single best h2h result seen in either sweep) -- the interaction structure is not simply diminishing returns, it is inconsistent enough that no combination can be picked by inspection"
  unknown: "whether ANY combination beats min_hands_lower alone on the real 4-tape panel (own AND margin, not just h2h vs the O26 clone, which the demand_share_up rejection already showed can reverse), and if so which one -- the best h2h candidate (min_hands=2 + feed_spare_poor=3) has not been panel-tested at all"
  resolving_measurement: "panel-test (4 tapes, own+margin, 2x 20-seed sets, KAGG_FIXED_SHOPS=1) at minimum the single best h2h combo (min_hands=2 + feed_spare_poor=3) against the min_hands_lower baseline (O36), not against unmodified O26 -- the comparison that matters now is 'does adding feed_spare_poor=3 on top of the already-DO'd min_hands=2 buy anything more', not vs the old frontier. If that clears, sweep the remaining 2-way and 3-way combinations the same way before picking one to fold into a numbered candidate"
  would_do: "a combination beats O36_MIN_HANDS2 (not O26) on both own and margin, reproducibly across 2 independent seed sets, majority of tapes each time -- promotes past min_hands_lower to a joint knob DO"
  would_abandon: "no combination beats O36 on the real panel (h2h-vs-clone gains don't transfer, matching the demand_share_up pattern), or the panel result is as inconsistent/non-additive as the h2h numbers already are -- in which case min_hands_lower stands alone and no joint-knob direction is recorded"
  cost: "cheap per cell but several panel runs deep (the h2h screen alone needed 4 extra evaluations beyond the 20-knob singles sweep; a proper panel-level factorial is 4-5x the cost of the single min_hands_lower confirmation) -- deferred rather than folded into this scouting pass"
  date: 2026-09-11

- id: crop_harvest_window_recoverability
  state: DELAY
  type: nonlinear_threshold
  mechanism: >
    Non-ongoing crops (WHEAT, CARROT, MELON) may expire via max_lifespan_step decay
    (_decay_plants) before being harvested, an irreversible hard cutoff. tools/crop_window_trace.py
    (panel: 4 tapes x 2 independent 20-seed sets, ~20,721 plantings) found O26's WHEAT decay rate
    stable at 4.4-7.6% on every tape/set cell vs 0.0-1.2% for every tape opponent on the same games
    -- the one crop/policy gap in the panel that cleared "positive on every tape, stable across
    sets". tools/wheat_decay_bridge.py then read the candidate's own per-turn actions on every
    decayed wheat tile directly (a unit occupies one tile per turn and can only take one action, so
    this is not inferred, it is observed): across all 4 tapes x 2 sets (802 decayed tiles total),
    95-99% of decayed tiles are VISITED_WATERED_BELOW_MAX (a unit was standing on the tile and chose
    WATER over HARVEST on a turn when yield_units was already >0 but still below WHEAT's max_yield);
    NEVER_VISITED (the free-fix, zero-displacement class) is 0% in every single panel cell.
  superseded_framing: >
    ORIGINAL (pre-bridge) framing was "find missed harvests and recover them" -- a scheduling/
    dispatch-failure hypothesis. The bridge falsifies that framing cleanly: there is essentially no
    zero-cost recovery class (0% NEVER_VISITED, panel-wide). O26 is not failing to reach or forgetting
    these tiles; it is making a deliberate, repeated growth-vs-harvest tradeoff (keep watering for
    more yield instead of banking a smaller guaranteed amount) and losing that bet on ~5-7% of
    plantings. That closes the "recoverable dispatch failure" hypothesis; do not reopen it without a
    new instrument. The mechanism itself, the decay-rate asymmetry vs every tape, and the panel
    depth stand as confirmed groundwork for the reframed question below.
  unknown: >
    Whether O26's current implicit wheat stopping rule (keep growing until forced) is economically
    too aggressive -- i.e. whether harvesting wheat earlier, near the max_lifespan_step boundary,
    has a stable INTERIOR economic optimum (harvest-yield-threshold x remaining-lifespan-threshold)
    that beats both "always keep growing" (current, ~5-7% decay loss) and "always harvest early"
    (guaranteed-but-smaller yield on every tile, sacrificing the ~93-96% that would have matured
    fine). This is now a pure threshold/dose-response question, not a scheduling-fix question.
  resolving_measurement: >
    A fixed-cutoff sweep (analogous to melon_cutoff_sweep-sep11's method, which is the durable
    precedent for this exact "protected window tolerates edge trimming, not interior interruption"
    class): sweep a small number of harvest-yield / remaining-lifespan-to-max_lifespan_step
    threshold combinations for WHEAT (e.g. harvest immediately once yield_units >= N with fewer
    than K turns of margin before max_lifespan_step, for a handful of (N, K) pairs bracketing the
    engine's own max_yield=6 and the ~8-step decay window), segmented/panel-tested per the
    nonlinear_threshold contract (20 seeds x 2 sets, own + margin, dose-response with interior
    optimum required -- a monotone result is an artefact per melon_cutoff_sweep's lesson).
  would_do: >
    A stable interior (N, K) configuration improves BOTH own money and margin at contract depth
    (20 x 2, t>=2.0), replicated across tapes, with a genuine interior optimum (not a monotone
    edge value, which would indicate the sweep is measuring something else).
  would_abandon: >
    Monotonic deterioration in either direction (no interior optimum -- "always grow" or "always
    harvest early" wins outright), OR an interior optimum exists but its gain does not clear the
    $250/metric noise floor once the sacrificed yield on the majority of tiles that would have
    matured fine is netted out, OR the result fails to replicate across seed sets/tapes (the
    demand_share_up and M=89 pattern: a win that doesn't survive held-out is not a win).
  cost: >
    Cheap-to-moderate sweep (single-crop, single-knob-pair, existing sweep methodology to copy from
    melon_cutoff_sweep) but explicitly LOWER PRIORITY than a free-recovery mechanism would have been
    -- every candidate intervention here necessarily displaces productive watering on tiles that
    would otherwise have reached higher yield, unlike a true dispatch fix which has no such cost.
    Sequenced behind the newly-unblocked animal marginal-economics experiments (the animal_scaling
    structural-dead-knob findings) -- this thread is an optimization of a deliberate, already-
    reasonable-looking tradeoff, not a bug fix, and the O29/O30/O31/O32 family's track record on
    "protect an irreversible loss" interventions argues for caution and lower urgency, not for
    stopping the thread. The value of this work so far is avoiding a wrong candidate (a wheat
    "protection" guardrail built on the false recoverability premise), not finding a candidate.
  date: 2026-09-11

- id: shed_capacity_margin_calibration
  state: DELAY
  resolution: >
    CORRECTED Sep 12: the first measurement pass (state: ABANDON, "occupancy never approaches 75")
    was WRONG -- caused by a script bug (tools/shed_overflow.py never wrote the advanced step back
    onto state[i].observation.step, so the vendor interpreter's `day = step // turns_per_day` stayed
    pinned at day 0 for the entire simulated episode; every game was a frozen first turn replayed 720
    times, not a real 29-day game). Fixed and re-run on the same standard 4-tape panel (seeds 71-90,
    both seats, 160 games, KAGG_FIXED_SHOPS=1), verified against a synthetic low-capacity control
    (shedCapacity=15 forces real discards: 46-59 units/game, confirming the discard/blocked-buy hooks
    actually fire when overflow occurs).
    CORRECTED RESULT: O26_CARROT_SIZING runs much closer to the ceiling than assumed -- mean max
    shed_load 91.2-94.2 across the 4 tapes, touching exactly 100 in 15-30 of 40 games per tape
    (38-75%), touching >=95 in 19-30 of 40 (48-75%). Opponent tapes run even closer (mean max_load
    98.9-100, touching >=90 for a mean of 6.3-16.2 turns/game, vs O26's 1.0-1.4). BUT: zero forced
    end-of-day discard events and zero purchases blocked by a full shed, for EITHER farm, in all 160
    games -- the 75/80 sell triggers are doing real, constant work at the edge of the cap, not sitting
    unused, and (on this panel) they hold: no measured loss despite the frequent ceiling contact.
  resolution_date: 2026-09-12
  type: calibration
  mechanism: >
    shed_cap=100 is a hard discard ceiling (_drop_inventories_to_shed deletes overflow
    outright); the chassis already defends with shed_load>75/80 sell triggers, but no
    tool measures how close actual games get to either the triggers or the cap.
  unknown: >
    Whether the chassis's existing shed_load > 75 (melon sell trigger) and > 80 (wheat
    surplus sell trigger) margins under the verified shed_cap=100 hard-discard ceiling
    (_drop_inventories_to_shed, vendor code: overflow is deleted outright, not held or
    blocked) are well-calibrated -- too conservative (selling early, depressing price for
    no reason), too late (games still hitting 100 and silently losing inventory), or
    already correct.
  resolving_measurement: >
    Cheap calibration audit only, not a candidate pipeline: a small addition to an existing
    replay-reading tool (e.g. allocation_matrix.py or spend_diff.py, which already see
    shed_capacity) to report per-game max shed_load and count of turns >=90/>=95/=100, both
    farms, standard tape panel. No new infrastructure beyond that query.
  would_do: >
    Games are found regularly touching >=95 (or hitting 100 and discarding real inventory)
    -- that would mean the existing 75/80 margins are too loose and a knob-type direction
    (raise the trigger thresholds) is warranted.
  would_abandon: >
    Occupancy rarely approaches 75 (or never approaches the cap) under current triggers --
    analogous to the animal_production_rate and hire_gate_output_loss "no discrepancy"
    results. In that case the current margin is probably conservative and this closes
    cheaply as a non-issue, same disposition as the 10-order market cap.
  cost: >
    Very cheap -- a measurement pass on data existing tools already read, no new candidate
    build, no panel run beyond the standard tape panel.
  date: 2026-09-11

