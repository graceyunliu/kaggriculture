    point (candidates/O38_WHEAT_EARLY_HARVEST.py, line ~1032). Does not re-examine the underlying decay
    mechanism/bridge finding (wheat_decay_bridge.py, 95-99% VISITED_WATERED_BELOW_MAX) itself, which stands
