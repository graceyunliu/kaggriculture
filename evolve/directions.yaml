  panel_note: "20x2, not the nominal 32x2 for lumpy_capital -- the effect size (30x noise floor, unanimous sign across 4 tapes and both sets on margin) makes a 32-cell confirmation unlikely to change the verdict, but a reopener should still run the full depth"
