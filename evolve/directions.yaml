    changes which candidate/policy ranks best, not whether it is observed.
  unknown: >
    Whether candidate/policy rankings actually change across shop-demand regimes (which
    shops are unlocked, and when), rather than shops being merely observable but
    ranking-irrelevant. Verified in vendor code: shop unlocks are a pure seed+day RNG draw
