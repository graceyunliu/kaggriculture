  hypothesis: "second open-ended scout: a 20-knob one-at-a-time sweep of every live, currently-default KNOBS value in the chassis (O26_CARROT_SIZING) that hadn't already been closed by a named ledger direction -- open_melons/open_wheat/open_cows/open_sheep, min_hands, load_per_hand, early_hire_days, melon_floor, harvest_min, demand_share, max_animals, hands_early, drop_min, feed_spare_poor, each nudged both directions where sensible -- should turn up an easy win the O16-O26 programme's manual tuning missed"
  measurement: "dev-seed h2h screen (10 seeds, KAGG_FIXED_SHOPS=1) of each of 20 single-knob perturbations vs unmodified O26, via a batch harness (/tmp/scout_sweep.py, not committed -- one-shot screening tool, results in evolve/RULES.md)"
  negative_evidence: "18 of 20 nudges are flat-to-negative at 10 seeds (|delta| <=1.5k, several sharply negative and informative: open_cows 2->3 is -31,066, open_sheep 2->3 is -35,685 -- a 3rd starting animal is a large mistake; load_per_hand in EITHER direction from 20 is negative, -5,886 at 25 and -4,401 at 15, an interior optimum already at the default; open_wheat similarly interior at 7, -2,889 at 10 and -6,261 at 4). The 2 positive nudges (demand_share 0.65: +1,350 h2h; min_hands 2: +1,530 h2h) were escalated separately -- demand_share_065 did not survive the real tape panel (see demand_share_up ABANDON below); min_hands_2 did (see min_hands_lower DO below)"
  scope: "one-at-a-time perturbation of the 20 named knobs at the tested values, dev-seed h2h screen only (not a panel-confirmed rejection of any individual knob beyond the two escalated) -- most of the current defaults sit at or near a local optimum in this knob space"
  reopen: "a genuinely different value for one of the 18 flat/negative knobs (not adjacent to what was tested), or a joint (multi-knob) sweep -- one-at-a-time perturbation can miss an interaction effect that a paired change would catch"
  date: 2026-09-11

