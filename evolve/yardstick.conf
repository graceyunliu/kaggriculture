# Sourced by evolve/supervisor.sh at the start of every segment (after git pull).
# The supervisor appends the tape named in Opponents/frontier.txt (refreshed daily from ladder replays) to this
# panel automatically, so the panel = these fixed tapes + the currently dominant ladder cluster.
# Sep 10: yardstick moved from H32 (a tape hybrid nothing own-code can beat; 12 segments/day for a week
# produced 0 held-out passes at dev margins around -$15k) to the current ladder submission O15, with the
# 4 real ladder-loss tapes as the fixed panel. loop.py's held-out promotion now also requires the
# candidate's mean panel margin >= the frontier's own (panel gate). Chassis = evolve/chassis.py = O15.
FRONTIER=candidates/O15_SALE_PRIORITY.py
CLONE=Opponents/tape_peterparker_106816877.py,Opponents/tape_alaylm_106813359.py,Opponents/tape_bahaenes_106828159.py,Opponents/tape_yangkuang2_106819729.py
SMOKE_FLOOR=-6000
DEV_PROMOTE=1500
# Sep 10: measurement mode. The engine draws each day's shop unlock from the per-day RNG AFTER _spawn_weeds has
# consumed one draw per empty tile on both farms, so any policy change re-rolls which shop unlocks (worth $25k-160k
# of a game). With this set, mini_engine draws the shop from its own seeded stream (policy-independent), which cuts
# the tape-panel noise from about +/-$15k to +/-$3k per opponent at n=20. Result-cache keys carry "_fs", so the first
# segment recomputes the frontier baseline and candidate panels. Not for absolute ladder numbers; for paired
# comparisons only (the ladder's re-roll is zero-mean, so expected margins are unchanged). See RULES.md, top.
export KAGG_FIXED_SHOPS=1
