# Sourced by evolve/supervisor.sh at the start of every segment (after git pull).
# The supervisor appends the tape named in Opponents/frontier.txt (refreshed daily from ladder replays) to this
# panel automatically, so the panel = these fixed tapes + the currently dominant ladder cluster.
# Sep 10: yardstick moved from H32 (a tape hybrid nothing own-code can beat; 12 segments/day for a week
# produced 0 held-out passes at dev margins around -$15k) to the current ladder submission O15, with the
# 4 real ladder-loss tapes as the fixed panel. loop.py's held-out promotion now also requires the
# candidate's mean panel margin >= the frontier's own (panel gate).
# Sep 16 rebase: frontier moved O15 -> O162_THREE_SHOPS65 (the actual current ladder champion; O15 was
# ~150 own-code generations stale). Chassis (evolve/chassis.py) rebuilt via `python3 evolve/blocks.py build`
# off the new K_LIVE = candidates/O162_THREE_SHOPS65.py (evolve/blocks.py), carrying forward every confirmed
# win since O15: O42_MAX_HANDS_LATE_EXPAND (day-gated labor cap relief), O62/O67_CAPITAL_EVERY1H (full
# per-turn economy checks every hour instead of once/day), plus whatever O68-O162 changed on top (three-shop
# handling, min_hands=2, capital_period knob now live -- see chassis.py KNOBS). SMOKE_FLOOR/DEV_PROMOTE left
# unchanged: both frontiers are own-code lineages (not a tape hybrid like H32) and recent measured deltas
# (O59 +$ hundreds, O67 vs O42 several-$k, O170/O171 -$800ish) sit inside the same order of magnitude these
# floors were calibrated for -- but treat as provisional until the first live segment's own panel numbers
# confirm the floors still make sense against O162's baseline (see evolve/directions.yaml for the full
# post-O42 disposition ledger feeding this rebase).
FRONTIER=candidates/O162_THREE_SHOPS65.py
# CLONE panel refreshed Sep 16 -- the old fixed four (peterparker/alaylm/bahaenes/yangkuang2, built
# Sep 4-8 from an old submission's real ladder losses) no longer appear anywhere in the current top-15
# leaderboard pull (kaggriculture-leader-fingerprint-data-pull-sep12), so they were no longer testing
# against real current competition. Replaced with tapes of the actual current top-ladder players:
# Majkel1337 (#1), ymg_aq (#2), Unknown Mother-Goose (#3), feel_the_agi (top-8) -- see
# kaggriculture-top3-deep-dive-sep12 for the matchup analysis behind why these three specifically
# matter (Majkel1337's build is a common counter to the other two). majkel1337/unknownmothergoose
# tapes built fresh (make_tape_agent.py) from the Sep 12 leaderboard replay pull; ymgaq/feeltheagi
# tapes already existed (Sep 10).
CLONE=Opponents/tape_majkel1337_107852724.py,Opponents/tape_ymgaq_106415741.py,Opponents/tape_unknownmothergoose_107932246.py,Opponents/tape_feeltheagi_107564195.py
SMOKE_FLOOR=-6000
DEV_PROMOTE=1500
# Sep 10: measurement mode. The engine draws each day's shop unlock from the per-day RNG AFTER _spawn_weeds has
# consumed one draw per empty tile on both farms, so any policy change re-rolls which shop unlocks (worth $25k-160k
# of a game). With this set, mini_engine draws the shop from its own seeded stream (policy-independent), which cuts
# the tape-panel noise from about +/-$15k to +/-$3k per opponent at n=20. Result-cache keys carry "_fs", so the first
# segment recomputes the frontier baseline and candidate panels. Not for absolute ladder numbers; for paired
# comparisons only (the ladder's re-roll is zero-mean, so expected margins are unchanged). See RULES.md, top.
export KAGG_FIXED_SHOPS=1
