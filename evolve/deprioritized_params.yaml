# Human-maintained exclusion list for evolve/space.py::mutate().
#
# Entries here are excluded from the uniform-random mutation pool whenever
# mutate()'s deprioritization flag is on (default ON — see
# evolve/space.py, EVOLVE_RESPECT_DEPRIORITIZED / mutate(respect_deprioritized=...)).
#
# This file implements Option A ("human-maintained exclusion/low-weight
# list") from docs/replay-audit-search-deprioritization-proposal.md.
# A human edits this file by hand after reading a replay-audit report;
# nothing writes to it automatically. Each entry MUST cite the specific
# finding that justifies it — no entry should exist without a citation.
#
# `params:` — SPACE parameter names (evolve/space.py KNOB_SPACE/CONST_SPACE)
# excluded from evolve/space.py::mutate()'s pool. Wired and enforced today.
#
# `blocks:` — execution-block names (operators.py EXEC_BLOCK_NAMES) that a
# human has flagged the same way, for when block_pair_mutate is ever wired
# to respect this file too. NOT YET ENFORCED: operators.py was intentionally
# left untouched this pass (space.py::mutate() only). Documented here now so
# the citation exists and isn't lost; wiring operators.py to read this
# section is listed as future work.

params:
  fert_keep:
    reason: >
      Phase 2 fertilizer apply/hold parity finding — no behavioral
      divergence between my play and the pooled opponent field at
      decision resolution (~92% hold, both cohorts). See
      artifacts/replay_state_policy_audit/REPORT_PHASE2.md, "FERTILIZE"
      section.
  fert_buy:
    reason: >
      Same finding as fert_keep — Phase 2 fertilizer apply/hold parity.
      REPORT_PHASE2.md.
  fert_carry:
    reason: >
      Same finding as fert_keep — Phase 2 fertilizer apply/hold parity.
      REPORT_PHASE2.md.
  open_wheat:
    reason: >
      Manus exact-O26 2x2x2x2 factorial: open_wheat=9 interacted with
      fert_carry=1 for +$1,942 on development, then reversed to -$817,
      t=-1.35 on fresh seeds 71-90. Do not retry this fitted branch.
      See docs/cloud-evolution-results-sep11.md.
  HERD_LAST_DAY:
    reason: >
      The same factorial found only negligible, non-replicating effects for
      day 15 versus 17. Keep fixed until a mechanism-specific hypothesis exists.
      See docs/cloud-evolution-results-sep11.md.

  wheat_stock:
    reason: >
      O171 (wheat_stock=20 + wheat_hold_days=1 + feed_spare_poor=3 combined, on O162) -- decisive
      ABANDON, own-money negative on 2 independent 20-seed sets; the combo compounds each knob's
      individual loss rather than cancelling it. See kaggriculture-o171-wheat-reserve-cluster-abandon-sep16.md.
  wheat_hold_days:
    reason: >
      Same O171 finding as wheat_stock -- combined-mode ABANDON on O162, replicated. Individually also
      ABANDON on O42 (panel-qualified, contract depth, 320 games, 2 independent seed sets).
      See kaggriculture-wheat-hold-days-panel-abandon-sep13.md and -o171-wheat-reserve-cluster-abandon-sep16.md.
  feed_spare_poor:
    reason: >
      Same O171 combined-mode finding as wheat_stock/wheat_hold_days. Also individually ABANDON in the
      min_hands=2 + feed_spare_poor=3 combo test. See kaggriculture-min-hands-fsp3-combo-abandon-sep12.md
      and -o171-wheat-reserve-cluster-abandon-sep16.md.
  wheat_water_tier:
    reason: >
      wheat_water_tier_engagement CONFIRMED ABANDON via three independent instruments (binding trace,
      dose sweep, engagement audit) -- reprioritizing wheat-watering ahead of harvest in dispatch tier
      order does not measurably delay other crops' harvests, and the direct effect is null.
      See kaggriculture-wheat-water-tier-binding-trace-sep13.md.
  drop_min:
    reason: >
      O170 (drop_min=3 + drop_radius=3 together, on O162) -- decisive ABANDON on own money, replicated
      across 2 independent 20-seed sets (t=-4.23, t=-3.11). Corrects an earlier scoping-bug "noop"
      verdict (O61) -- this is the first valid test of the combined mechanism and it is a confirmed
      loser. See kaggriculture-o170-drop-min-radius-corrected-retest-abandon-sep16.md.
  drop_radius:
    reason: >
      Same O170 finding as drop_min -- the two knobs only do anything together (drop_radius alone
      cannot fire without drop_min > 0 gating the code path), and the combined mechanism is a confirmed
      loser. See kaggriculture-o170-drop-min-radius-corrected-retest-abandon-sep16.md.
  melon_rush:
    reason: >
      melon_rush binding trace + contract-depth panel: population-level melon sale price is ~3% higher
      under rush but the effect does not survive to a real own-money/margin gain at contract depth --
      two independent seed sets flip sign entirely on every metric and every tape.
      See kaggriculture-melon-rush-contract-panel-abandon-sep13.md.
  straw_delay:
    reason: >
      straw_delay binding trace (Sep 12): pre-day-10 strawberry plantings do not realize worse
      economics than day-10+ plantings in the same baseline games -- the mechanism this knob targets
      does not exist. See kaggriculture-straw-delay-binding-trace-abandon-sep12.md.

blocks:
  dispatch:
    reason: >
      Phase 2 chore idle/assigned parity finding — both cohorts kept
      hands ~100% assigned at hourly resolution, no divergence found. See
      artifacts/replay_state_policy_audit/REPORT_PHASE2.md, "CHORE"
      section. Chore-priority logic has no dedicated SPACE parameter; the
      "dispatch" execution block (operators.py EXEC_BLOCK_NAMES) is the
      actual mutation hook for chore/labor-routing behavior — see
      docs/replay-audit-search-deprioritization-proposal.md section 1.
      NOT YET ENFORCED (see file header) — operators.py was not modified
      this pass.
